name: CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Lint HTML
        run: npx --yes htmlhint index.html --rules tagname-lowercase,doctype-first,title-require,tag-pair
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          s = open('index.html', encoding='utf-8').read()
          open('app.js', 'w').write(re.findall(r'<script>(.*?)</script>', s, re.S)[0])
          PY
          node --check app.js

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject database config
        run: |
          sed -i "s|__SUPABASE_URL__|${{ secrets.SUPABASE_URL }}|; s|__SUPABASE_ANON_KEY__|${{ secrets.SUPABASE_ANON_KEY }}|" index.html
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject database config
        run: |
          sed -i "s|__SUPABASE_URL__|${{ secrets.SUPABASE_URL }}|; s|__SUPABASE_ANON_KEY__|${{ secrets.SUPABASE_ANON_KEY }}|" index.html
          mkdir site && cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
